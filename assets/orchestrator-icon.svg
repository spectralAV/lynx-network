<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Chassis Background -->
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#bg)" stroke="#334155" stroke-width="6"/>

  <!-- Top Stream Deck Key Grid (Green=OK, Amber=Low Batt, Red=Clip/Panic, Blue=Comms) -->
  <rect x="38" y="38" width="38" height="34" rx="8" fill="url(#greenGlow)"/>
  <rect x="86" y="38" width="38" height="34" rx="8" fill="url(#amberGlow)"/>
  <rect x="134" y="38" width="38" height="34" rx="8" fill="url(#redGlow)"/>
  <rect x="182" y="38" width="38" height="34" rx="8" fill="#2563eb"/>

  <!-- LCD Touch Strip (NexLink & S21 Scribble Strip) -->
  <rect x="38" y="86" width="182" height="32" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  <text x="50" y="107" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="15">VOX1 84% | NL:98%</text>

  <!-- 4x Rotary Encoders -->
  <circle cx="57" cy="148" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
  <line x1="57" y1="148" x2="57" y2="136" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

  <circle cx="105" cy="148" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
  <line x1="105" y1="148" x2="114" y2="140" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <circle cx="153" cy="148" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
  <line x1="153" y1="148" x2="144" y2="140" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <circle cx="201" cy="148" r="14" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
  <line x1="201" y1="148" x2="201" y2="136" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>

  <!-- Dual-Mode Panic Foot-Switch Bar -->
  <rect x="38" y="180" width="182" height="38" rx="10" fill="#111827" stroke="#ef4444" stroke-width="2.5"/>
  <text x="129" y="204" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13" letter-spacing="1.5">DUAL-MODE PANIC</text>
</svg>
